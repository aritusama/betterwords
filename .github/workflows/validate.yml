name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check deterministic rule sync
        run: |
          cp betterwords.md skills/betterwords/references/betterwords.md
          git diff --exit-code -- skills/betterwords/references/betterwords.md
      - name: Validate package
        run: python .github/scripts/validate.py
      - name: Exercise package integrity failures
        run: python -B -m unittest discover -s .github/scripts/tests -v
